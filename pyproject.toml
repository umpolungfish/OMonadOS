[project]
name = "omonad_OS"
version = "0.1.0"
description = "The ⊙ Operating System — self-imscribing Frobenius kernel with Belnap FOUR state and Crystal filesystem"
authors = [{name = "Lando⊗⊙perator"}]
requires-python = ">=3.10"
dependencies = ["imasmic_core>=0.5.69"]

[project.scripts]
omos = "omonad_OS.src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
